name: publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner-version:
        description: actions/runner release version without the v prefix
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare runner layer
        env:
          RUNNER_VERSION: ${{ inputs.runner-version || (github.event_name == 'push' && github.ref_name) || '2.337.0' }}
          RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: ./build-runner-layer.sh
      - name: Build and smoke amd64 images
        env:
          BASE_IMAGE: imp-runner-base-smoke:${{ github.sha }}
          RUNNER_IMAGE: imp-runner-layer-smoke:${{ github.sha }}
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --tag "$BASE_IMAGE" base
          docker buildx build --platform ${{ matrix.platform }} --load \
            --tag "$RUNNER_IMAGE" runner-layer
          ./smoke.sh
      - name: Build and publish base
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: base
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/syscode-labs/imp-runner-base:${{ github.sha }}
            ghcr.io/syscode-labs/imp-runner-base:${{ inputs.runner-version || github.ref_name }}
      - name: Build and publish runner layer
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: runner-layer
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/syscode-labs/imp-runner-layer:${{ github.sha }}
            ghcr.io/syscode-labs/imp-runner-layer:${{ inputs.runner-version || github.ref_name }}
